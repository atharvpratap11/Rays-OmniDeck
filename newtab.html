<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rays.foundation</title>
  <style>
    :root {
      --bg-color: #070b14;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --input-bg: #0e1626;
      --border-color: #1e293b;
      --border-focus: #0052ff;
      --brand-gradient: linear-gradient(135deg, #0052ff 0%, #38bdf8 100%);
      --pill-bg: #131d33;
      --pill-active-bg: rgba(0, 82, 255, 0.2);
      --pill-active-border: #0052ff;
      --pill-active-color: #38bdf8;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg-color: #f8fafc;
        --text-color: #0f172a;
        --subtext-color: #64748b;
        --input-bg: #ffffff;
        --border-color: #e2e8f0;
        --border-focus: #0052ff;
        --pill-bg: #f1f5f9;
        --pill-active-bg: rgba(0, 82, 255, 0.12);
        --pill-active-border: #0052ff;
        --pill-active-color: #0052ff;
      }
    }

    /* Support forced data-theme attribute */
    html[data-theme="light"] {
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --subtext-color: #64748b;
      --input-bg: #ffffff;
      --border-color: #e2e8f0;
      --border-focus: #0052ff;
      --pill-bg: #f1f5f9;
      --pill-active-bg: rgba(0, 82, 255, 0.12);
      --pill-active-border: #0052ff;
      --pill-active-color: #0052ff;
    }

    html[data-theme="dark"] {
      --bg-color: #070b14;
      --text-color: #f8fafc;
      --subtext-color: #94a3b8;
      --input-bg: #0e1626;
      --border-color: #1e293b;
      --border-focus: #0052ff;
      --pill-bg: #131d33;
      --pill-active-bg: rgba(0, 82, 255, 0.2);
      --pill-active-border: #0052ff;
      --pill-active-color: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      transition: background-color 0.2s ease, color 0.2s ease;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 580px;
      padding: 0 24px;
      margin-top: -60px;
    }

    .brand-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.8px;
      margin-bottom: 24px;
      background: var(--brand-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0052ff;
      box-shadow: 0 0 12px #0052ff;
      display: inline-block;
    }

    .search-form {
      width: 100%;
      position: relative;
      margin-bottom: 16px;
    }

    .search-input-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      background-color: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 28px;
      padding: 6px 18px;
      height: 52px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .search-input-wrapper:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(0, 82, 255, 0.25), 0 8px 24px rgba(0, 0, 0, 0.12);
      transform: translateY(-1px);
    }

    .search-icon {
      color: var(--subtext-color);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
    }

    .search-icon svg {
      width: 18px;
      height: 18px;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text-color);
      font-family: inherit;
    }

    .search-input::placeholder {
      color: var(--subtext-color);
      opacity: 0.7;
    }

    .search-submit-btn {
      background: none;
      border: none;
      color: var(--subtext-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.15s ease;
    }

    .search-submit-btn:hover {
      color: #0052ff;
      background-color: var(--pill-bg);
    }

    /* Engine Selector Dropdown */
    .engine-selector-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .engine-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext-color);
    }

    .engine-dropdown {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      outline: none;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .engine-dropdown:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(0, 82, 255, 0.2);
    }

    .engine-dropdown option {
      background-color: var(--input-bg);
      color: var(--text-color);
    }

    /* Wallpaper Customization Bar */
    .wallpaper-control-bar {
      position: fixed;
      bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(14, 22, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      z-index: 100;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    @media (prefers-color-scheme: light) {
      .wallpaper-control-bar {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(0, 0, 0, 0.08);
      }
    }

    html[data-theme="light"] .wallpaper-control-bar {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.08);
    }

    .wallpaper-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--subtext-color);
    }

    .wallpaper-dropdown {
      background: transparent;
      border: none;
      color: var(--text-color);
      font-size: 12px;
      font-weight: 500;
      outline: none;
      cursor: pointer;
    }

    .wallpaper-dropdown option {
      background-color: #0e1626;
      color: #f8fafc;
    }

    html[data-theme="light"] .wallpaper-dropdown option {
      background-color: #ffffff;
      color: #0f172a;
    }

    .wallpaper-custom-btn {
      background: rgba(0, 82, 255, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(0, 82, 255, 0.4);
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }

    .wallpaper-custom-btn:hover {
      background: #0052ff;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-title">
      <span>rays.foundation</span>
      <span class="brand-dot"></span>
    </div>

    <form id="search-form" class="search-form">
      <div class="search-input-wrapper">
        <div class="search-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </div>
        <input 
          type="text" 
          id="search-input" 
          class="search-input" 
          placeholder="Search the web or enter URL..." 
          autofocus 
          autocomplete="off" 
          spellcheck="false"
        >
        <button type="submit" class="search-submit-btn" title="Search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"/>
            <polyline points="12 5 19 12 12 19"/>
          </svg>
        </button>
      </div>
    </form>

    <!-- Search Engine Selector Dropdown -->
    <div class="engine-selector-wrap">
      <span class="engine-label">Search Engine:</span>
      <select id="engine-select" class="engine-dropdown" title="Choose Search Engine">
        <option value="google" data-engine="google">Google</option>
        <option value="duckduckgo" data-engine="duckduckgo">DuckDuckGo</option>
        <option value="bing" data-engine="bing">Microsoft Bing</option>
        <option value="yahoo" data-engine="yahoo">Yahoo</option>
        <option value="brave" data-engine="brave">Brave Search</option>
        <option value="ecosia" data-engine="ecosia">Ecosia</option>
        <option value="startpage" data-engine="startpage">Startpage</option>
        <option value="yandex" data-engine="yandex">Yandex</option>
        <option value="baidu" data-engine="baidu">Baidu</option>
      </select>
    </div>
  </div>

  <!-- Wallpaper Switcher Bar -->
  <div class="wallpaper-control-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
      <circle cx="8.5" cy="8.5" r="1.5"/>
      <polyline points="21 15 16 10 5 21"/>
    </svg>
    <span class="wallpaper-label">Wallpaper:</span>
    <select id="wallpaper-select" class="wallpaper-dropdown" title="Change Home Wallpaper">
      <option value="aurora">Cosmic Aurora (Default)</option>
      <option value="cyber-mesh">Deep Tech Mesh</option>
      <option value="gradient-dark">Midnight Gradient</option>
      <option value="sunset-glow">Sunset Glow</option>
      <option value="clean-slate">Clean Minimal Slate</option>
      <option value="custom">Custom Image URL...</option>
    </select>
    <button id="wallpaper-upload-btn" class="wallpaper-custom-btn" title="Choose Local Wallpaper Image">
      <span>Upload</span>
    </button>
    <input type="file" id="wallpaper-file-input" accept="image/*" style="display: none;">
  </div>

  <script>
    const searchForm = document.getElementById('search-form');
    const searchInput = document.getElementById('search-input');
    const engineSelect = document.getElementById('engine-select');
    const wallpaperSelect = document.getElementById('wallpaper-select');
    const wallpaperUploadBtn = document.getElementById('wallpaper-upload-btn');
    const wallpaperFileInput = document.getElementById('wallpaper-file-input');

    const ENGINES = {
      google: 'https://www.google.com/search?q=',
      duckduckgo: 'https://duckduckgo.com/?q=',
      bing: 'https://www.bing.com/search?q=',
      yahoo: 'https://search.yahoo.com/search?p=',
      brave: 'https://search.brave.com/search?q=',
      ecosia: 'https://www.ecosia.org/search?q=',
      startpage: 'https://www.startpage.com/sp/search?query=',
      yandex: 'https://yandex.com/search/?text=',
      baidu: 'https://www.baidu.com/s?wd='
    };

    const WALLPAPERS = {
      'aurora': 'radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.45) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(88, 28, 135, 0.4) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(14, 116, 144, 0.35) 0px, transparent 50%), radial-gradient(at 0% 100%, rgba(15, 23, 42, 0.9) 0px, transparent 50%), #070b14',
      'cyber-mesh': 'radial-gradient(circle at 50% 50%, rgba(14, 165, 233, 0.15) 0%, transparent 60%), linear-gradient(135deg, #090d16 0%, #030712 100%)',
      'gradient-dark': 'linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%)',
      'sunset-glow': 'radial-gradient(circle at 20% 20%, rgba(244, 63, 94, 0.25) 0%, transparent 40%), radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.2) 0%, transparent 50%), #090d16',
      'clean-slate': '#070b14'
    };

    // 1. Initialize Engine Dropdown
    let selectedEngine = localStorage.getItem('rays_engine') || 'google';
    if (!ENGINES[selectedEngine]) selectedEngine = 'google';
    if (engineSelect) {
      engineSelect.value = selectedEngine;
      engineSelect.addEventListener('change', () => {
        selectedEngine = engineSelect.value;
        localStorage.setItem('rays_engine', selectedEngine);
        searchInput.focus();
      });
    }

    // 2. Initialize Wallpaper
    function applyWallpaper(wpKey, customUrl = null) {
      if (customUrl) {
        document.body.style.backgroundImage = `url("${customUrl}")`;
        document.body.style.backgroundSize = 'cover';
        document.body.style.backgroundPosition = 'center';
        document.body.style.backgroundRepeat = 'no-repeat';
        localStorage.setItem('rays_wallpaper_type', 'custom');
        localStorage.setItem('rays_wallpaper_url', customUrl);
        if (wallpaperSelect) wallpaperSelect.value = 'custom';
        return;
      }

      const wpStyle = WALLPAPERS[wpKey] || WALLPAPERS['aurora'];
      document.body.style.background = wpStyle;
      document.body.style.backgroundSize = 'cover';
      document.body.style.backgroundPosition = 'center';
      document.body.style.backgroundRepeat = 'no-repeat';
      localStorage.setItem('rays_wallpaper_type', wpKey);
      localStorage.removeItem('rays_wallpaper_url');
      if (wallpaperSelect) wallpaperSelect.value = wpKey;
    }

    const savedWpType = localStorage.getItem('rays_wallpaper_type') || 'aurora';
    const savedWpUrl = localStorage.getItem('rays_wallpaper_url');
    if (savedWpType === 'custom' && savedWpUrl) {
      applyWallpaper('custom', savedWpUrl);
    } else {
      applyWallpaper(savedWpType);
    }

    if (wallpaperSelect) {
      wallpaperSelect.addEventListener('change', () => {
        const val = wallpaperSelect.value;
        if (val === 'custom') {
          const userUrl = prompt('Enter image URL for wallpaper:');
          if (userUrl && userUrl.trim()) {
            applyWallpaper('custom', userUrl.trim());
          } else {
            wallpaperSelect.value = localStorage.getItem('rays_wallpaper_type') || 'aurora';
          }
        } else {
          applyWallpaper(val);
        }
      });
    }

    if (wallpaperUploadBtn && wallpaperFileInput) {
      wallpaperUploadBtn.addEventListener('click', () => {
        wallpaperFileInput.click();
      });

      wallpaperFileInput.addEventListener('change', (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (loadEvt) => {
          const dataUrl = loadEvt.target.result;
          applyWallpaper('custom', dataUrl);
        };
        reader.readAsDataURL(file);
      });
    }

    // 3. Search Form Submit
    searchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      // If query is an exact URL or domain
      if (/^https?:\/\//i.test(query)) {
        window.location.href = query;
        return;
      }
      if (/^(localhost|127\.0\.0\.1)(:\d+)?(\/.*)?$/i.test(query)) {
        window.location.href = 'http://' + query;
        return;
      }
      if (/^[a-z0-9-]+(\.[a-z0-9-]+)+(\/.*)?$/i.test(query) && !query.includes(' ')) {
        window.location.href = 'https://' + query;
        return;
      }

      // Otherwise, search with selected engine
      const searchUrl = ENGINES[selectedEngine] || ENGINES.google;
      window.location.href = searchUrl + encodeURIComponent(query);
    });

    // 4. Sync theme from localStorage if available
    try {
      const savedTheme = localStorage.getItem('rays_theme_mode') || localStorage.getItem('rays_theme');
      if (savedTheme && savedTheme !== 'auto' && savedTheme !== 'system') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
    } catch (_e) {}
  </script>
</body>
</html>
